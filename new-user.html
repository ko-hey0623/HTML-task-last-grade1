<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 - LiveHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #8b5cf6;
            --secondary-color: #ec4899;
            --dark-bg: #18181b;
        }
        
        body {
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--primary-color) 50%, var(--secondary-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
            overflow-x: hidden;
        }
        
        /* 背景のアニメーション装飾 */
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
            z-index: 0;
        }
        
        body::after {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.3), transparent);
            border-radius: 50%;    
            animation: float 8s ease-in-out infinite reverse;
            z-index: 0;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
        
        .login-container {
            max-width: 480px;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        .login-card {
            background: white;
            border-radius: 25px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            overflow: hidden;
            margin-bottom: 20px;
        }
        
        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 40px 40px;
            text-align: center;
        }
        
        .login-icon {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 2rem;
        }
        
        .login-body {
            padding: 40px;
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.25);
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            color: white;
            padding: 14px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.5);
        }
        
        .social-login-btn {
            border: 2px solid #e5e7eb;
            padding: 12px;
            transition: all 0.2s ease;
            font-weight: 600;
        }
        
        .social-login-btn:hover {
            border-color: var(--primary-color);
            background-color: rgba(139, 92, 246, 0.05);
        }
        
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 2px solid #e5e7eb;
        }
        
        .divider span {
            padding: 0 15px;
            color: #6b7280;
            font-weight: 600;
            font-size: 0.9rem;
        }
        
        .back-link {
            position: absolute;
            top: 30px;
            left: 30px;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 18px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .input-group-text {
            background: transparent;
            border-right: none;
        }
        
        .form-control {
            border-left: none;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        <i class="bi bi-arrow-left-circle"></i> ホーム
    </a>

    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-icon">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h2 class="fw-bold mb-1">新規登録</h2>
                <p class="mb-0">MusicHubコミュニティに参加しよう</p>
            </div>

            <div class="login-body">
                <form id="signupForm">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">ユーザー名</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" placeholder="Music Taro" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">メールアドレス</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">パスワード</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" placeholder="8文字以上" required minlength="8">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-bold">パスワード（確認）</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-shield-check"></i></span>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="もう一度入力してください" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-login w-100 mb-3">
                        アカウントを作成
                    </button>

                    <div class="alert alert-danger d-none" role="alert" id="errorAlert">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span id="errorText">入力内容を確認してください</span>
                    </div>
                </form>

                <div class="divider">
                    <span>SNSアカウントで登録</span>
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-6">
                        <button class="btn social-login-btn w-100"><i class="bi bi-google"></i> Google</button>
                    </div>
                    <div class="col-6">
                        <button class="btn social-login-btn w-100"><i class="bi bi-apple"></i> Apple</button>
                    </div>
                </div>

                <div class="text-center">
                    <p class="text-muted mb-0">
                        既にアカウントをお持ちですか？
                        <a href="new-user.html" class="text-decoration-none fw-bold" style="color: var(--primary-color);">ログイン</a>
                    </p>
                </div>
            </div>
        </div>

        <div class="text-center mt-4 text-white">
            <p class="small">&copy; 2024 MusicHub. 登録することで利用規約に同意したことになります。</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            const errorAlert = document.getElementById('errorAlert');
            const errorText = document.getElementById('errorText');
            
            // パスワード一致チェック
            if (password !== confirm) {
                errorText.innerText = "パスワードが一致しません";
                errorAlert.classList.remove('d-none');
                return;
            }
            
            alert('アカウント作成に成功しました！');
            window.location.href = 'index.html';
        });

        // 入力開始時にエラーを消す
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => {
                document.getElementById('errorAlert').classList.add('d-none');
            });
        });
    </script>
</body>
</html>
